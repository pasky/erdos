name = "Erdos"
defaultTargets = ["Erdos", "audit"]

# No silently-introduced implicit binders anywhere in the corpus.
[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

# The mathematics. The glob builds every module under Erdos/
# unconditionally: there is no root import file to maintain, and an
# unimported orphan module is impossible at the lake level.
[[lean_lib]]
name = "Erdos"
globs = ["Erdos.+"]

# The audit tool (kept out of the math lib: Erdos/ contains no
# metaprogramming beyond the syntax objects that term-level notation mints).
[[lean_lib]]
name = "ErdosAudit"
globs = ["Audit.+"]

[[lean_exe]]
name = "audit"
root = "Audit.Main"
supportInterpreter = true
